name: CI

on:
    pull_request:
        branches: [master]
    workflow_call:

permissions:
    contents: read

env:
    CGO_ENABLED: "0"

jobs:
    check:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
              with:
                  persist-credentials: false
                  fetch-depth: 0
            - uses: actions/setup-go@v5
              with:
                  go-version-file: go.mod
            - name: Check workflow syntax
              run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
            - name: Check for unresolved conflict markers
              run: |
                  if git grep -n -E '^(<<<<<<< |=======($| )|>>>>>>> )'; then
                      exit 1
                  fi
            - name: Check pull request commit messages
              if: github.event_name == 'pull_request'
              env:
                  BASE: ${{ github.event.pull_request.base.sha }}
                  HEAD_COMMIT: ${{ github.event.pull_request.head.sha }}
              run: |
                  pipx install commitizen
                  cz check --rev-range "$BASE..$HEAD_COMMIT"
            - name: Scan introduced commits for secrets
              if: github.event_name == 'pull_request' || github.event_name == 'push'
              env:
                  BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
                  HEAD_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
              run: |
                  go run github.com/zricethezav/gitleaks/v8@v8.30.1 git --redact --log-opts="$BASE..$HEAD_COMMIT"
            - name: Test
              run: go test ./...
            - name: Vet
              run: go vet ./...

    cross-build:
        name: Build ${{ matrix.target.role }} (${{ matrix.target.goos }}/${{ matrix.arch }})
        runs-on: ubuntu-latest
        strategy:
            matrix:
                arch: [amd64, arm64]
                target:
                    - { role: tracker, goos: windows }
                    - { role: client, goos: windows }
                    - { role: server, goos: windows }
                    - { role: server, goos: linux }
        steps:
            - uses: actions/checkout@v4
              with:
                  persist-credentials: false
            - uses: actions/setup-go@v5
              with:
                  go-version-file: go.mod
            - name: Cross-build
              env:
                  GOOS: ${{ matrix.target.goos }}
                  GOARCH: ${{ matrix.arch }}
              run: go build -trimpath -o "$RUNNER_TEMP/tracker" ./cmd/${{ matrix.target.role }}
