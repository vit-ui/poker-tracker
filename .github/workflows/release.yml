name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
      - name: Build all binaries
        env:
          TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          set -euo pipefail
          for arch in amd64 arm64; do
            # All-local (combined) — Windows GUI, with the bot token.
            GOOS=windows GOARCH=$arch go build -trimpath \
              -ldflags "-s -w -H=windowsgui -X main.BotToken=$TOKEN" \
              -o tracker-$arch.exe ./cmd/tracker
            # Split client — Windows console app, NO bot token (never talks to Telegram).
            GOOS=windows GOARCH=$arch go build -trimpath \
              -ldflags "-s -w" \
              -o tracker-client-$arch.exe ./cmd/client
            # Split server — Windows + Linux, with the bot token (the only Telegram-talking split role).
            GOOS=windows GOARCH=$arch go build -trimpath \
              -ldflags "-s -w -X main.BotToken=$TOKEN" \
              -o tracker-server-windows-$arch.exe ./cmd/server
            GOOS=linux GOARCH=$arch go build -trimpath \
              -ldflags "-s -w -X main.BotToken=$TOKEN" \
              -o tracker-server-linux-$arch ./cmd/server
            # Package the Linux server as a tarball: binary (renamed tracker-server) + install.sh.
            mkdir -p pkg/tracker-server
            cp tracker-server-linux-$arch pkg/tracker-server/tracker-server
            cp packaging/install.sh pkg/tracker-server/install.sh
            chmod +x pkg/tracker-server/tracker-server pkg/tracker-server/install.sh
            tar -C pkg -czf tracker-server-linux-$arch.tar.gz tracker-server
            rm -rf pkg
          done
        shell: bash
      - uses: actions/upload-artifact@v4
        with:
          name: binaries
          path: |
            tracker-amd64.exe
            tracker-arm64.exe
            tracker-client-amd64.exe
            tracker-client-arm64.exe
            tracker-server-windows-amd64.exe
            tracker-server-windows-arm64.exe
            tracker-server-linux-amd64.tar.gz
            tracker-server-linux-arm64.tar.gz

  installer:
    needs: build
    runs-on: windows-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: binaries
      - name: Determine version
        id: version
        shell: bash
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - name: Build amd64 installer
        uses: Minionguyjpro/Inno-Setup-Action@v1.2.2
        with:
          path: setup.iss
          options: /O+ "/DAppVersion=${{ steps.version.outputs.version }}" "/DArch=amd64" "/DPublishArch=x64"
      - name: Build arm64 installer
        uses: Minionguyjpro/Inno-Setup-Action@v1.2.2
        with:
          path: setup.iss
          options: /O+ "/DAppVersion=${{ steps.version.outputs.version }}" "/DArch=arm64" "/DPublishArch=arm"
      - uses: actions/upload-artifact@v4
        with:
          name: Setup
          path: |
            Output/PokerTracker-v${{ steps.version.outputs.version }}-x64.exe
            Output/PokerTracker-v${{ steps.version.outputs.version }}-arm.exe

  release:
    needs: installer
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: Setup
      - uses: actions/download-artifact@v4
        with:
          name: binaries
      - name: Extract release notes from CHANGELOG
        shell: bash
        run: |
          # Pull the "## <tag> …" section (up to the next "## ") into the body.
          # No matching section fails the job: a public release must never
          # ship with a placeholder description — fix the CHANGELOG heading
          # ("## <tag> — <date>", trailing space after the tag) and re-tag.
          awk -v h="## ${GITHUB_REF_NAME} " '
            index($0, h) == 1 { grab = 1; next }
            /^## / && grab { exit }
            grab { print }
          ' CHANGELOG.md > RELEASE_NOTES.md
          if [ ! -s RELEASE_NOTES.md ]; then
            echo "::error::CHANGELOG.md has no '## ${GITHUB_REF_NAME} — <date>' section — add it and re-tag."
            exit 1
          fi
      - uses: softprops/action-gh-release@v2
        with:
          body_path: RELEASE_NOTES.md
          files: |
            PokerTracker-v${{ needs.installer.outputs.version }}-x64.exe
            PokerTracker-v${{ needs.installer.outputs.version }}-arm.exe
            tracker-server-windows-amd64.exe
            tracker-server-windows-arm64.exe
            tracker-server-linux-amd64.tar.gz
            tracker-server-linux-arm64.tar.gz
