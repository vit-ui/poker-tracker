name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
      - name: Build binaries (amd64 + arm64)
        run: |
          GOOS=windows GOARCH=amd64 go build -trimpath \
            -ldflags "-s -w -H=windowsgui -X main.BotToken=${{ secrets.TELEGRAM_BOT_TOKEN }}" \
            -o tracker-amd64.exe ./cmd/tracker
          GOOS=windows GOARCH=arm64 go build -trimpath \
            -ldflags "-s -w -H=windowsgui -X main.BotToken=${{ secrets.TELEGRAM_BOT_TOKEN }}" \
            -o tracker-arm64.exe ./cmd/tracker
        shell: bash
      - uses: actions/upload-artifact@v4
        with:
          name: tracker-exe
          path: |
            tracker-amd64.exe
            tracker-arm64.exe

  installer:
    needs: build
    runs-on: windows-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: tracker-exe
      - name: Determine version
        id: version
        shell: bash
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - name: Build amd64 installer
        uses: Minionguyjpro/Inno-Setup-Action@v1.2.2
        with:
          path: setup.iss
          options: /O+ "/DAppVersion=${{ steps.version.outputs.version }}" "/DArch=amd64" "/DPublishArch=x64"
      - name: Build arm64 installer
        uses: Minionguyjpro/Inno-Setup-Action@v1.2.2
        with:
          path: setup.iss
          options: /O+ "/DAppVersion=${{ steps.version.outputs.version }}" "/DArch=arm64" "/DPublishArch=arm"
      - uses: actions/upload-artifact@v4
        with:
          name: Setup
          path: |
            Output/PokerTracker-v${{ steps.version.outputs.version }}-x64.exe
            Output/PokerTracker-v${{ steps.version.outputs.version }}-arm.exe

  release:
    needs: installer
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Setup
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            PokerTracker-v${{ needs.installer.outputs.version }}-x64.exe
            PokerTracker-v${{ needs.installer.outputs.version }}-arm.exe
