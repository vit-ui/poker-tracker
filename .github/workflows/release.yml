name: Release

on:
    push:
        branches: [master]
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: poker-tracker-release
    cancel-in-progress: false

jobs:
    validate:
        if: github.ref == 'refs/heads/master'
        uses: ./.github/workflows/ci.yml

    release:
        needs: validate
        runs-on: ubuntu-latest
        permissions:
            contents: write
            issues: write
            pull-requests: write
        outputs:
            created: ${{ steps.release.outputs.release_created }}
            tag: ${{ steps.release.outputs.tag_name }}
            version: ${{ steps.release.outputs.version }}
        steps:
            - uses: actions/checkout@v4
              with:
                  persist-credentials: false
                  fetch-depth: 0
            - name: Check the historical baseline
              id: baseline
              env:
                  GH_TOKEN: ${{ github.token }}
              run: |
                  if [[ "$(jq -r '.["."]' .release-please-manifest.json)" == 3.0.0 ]]; then
                      if [[ "$(git rev-parse -q --verify 'refs/tags/v3.0.0^{commit}')" != 97789b37f6124e7bfd46130a03c87c2c0ed6c74c ]]; then
                          echo '::notice::Publish the rebuilt historical releases to enable Release Please.'
                          exit 0
                      fi
                      [[ "$(gh release view v3.0.0 --json isDraft --jq .isDraft)" == false ]]
                  fi
                  echo 'ready=true' >> "$GITHUB_OUTPUT"
            - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7
              id: release
              if: steps.baseline.outputs.ready == 'true'
              with:
                  target-branch: master

    package:
        needs: release
        if: needs.release.outputs.created == 'true'
        uses: ./.github/workflows/package.yml
        with:
            source: ${{ needs.release.outputs.tag }}
            version: ${{ needs.release.outputs.version }}

    publish:
        needs: [release, package]
        runs-on: ubuntu-latest
        permissions:
            contents: write
        env:
            GH_TOKEN: ${{ github.token }}
            GH_REPO: ${{ github.repository }}
            TAG: ${{ needs.release.outputs.tag }}
            VERSION: ${{ needs.release.outputs.version }}
        steps:
            - uses: actions/checkout@v4
              with:
                  persist-credentials: false
            - uses: actions/download-artifact@v4
              with:
                  name: windows-installer
            - uses: actions/download-artifact@v4
              with:
                  name: linux-installer
            - name: Verify and publish the completed draft
              run: |
                  set -euo pipefail
                  [[ "$TAG" == "v$VERSION" ]]
                  bash packaging/publish.sh "$TAG" true "PokerTracker-Setup-$VERSION.exe" PokerTracker-Server-linux.tar.gz
