name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
      - name: Build binary
        run: |
          go build -ldflags "-H=windowsgui -X main.BotToken=${{ secrets.TELEGRAM_BOT_TOKEN }}" -o tracker.exe ./cmd/tracker
        shell: bash
      - uses: actions/upload-artifact@v4
        with:
          name: tracker-exe
          path: tracker.exe

  installer:
    needs: build
    runs-on: windows-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: tracker-exe
      - name: Determine version
        id: version
        shell: bash
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - uses: Minionguyjpro/Inno-Setup-Action@v1.2.2
        with:
          path: setup.iss
          options: /O+ "/DAppVersion=${{ steps.version.outputs.version }}"
      - uses: actions/upload-artifact@v4
        with:
          name: Setup
          path: Output/PokerTracker-v${{ steps.version.outputs.version }}.exe

  release:
    needs: installer
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Setup
      - uses: softprops/action-gh-release@v2
        with:
          files: PokerTracker-v${{ needs.installer.outputs.version }}.exe
